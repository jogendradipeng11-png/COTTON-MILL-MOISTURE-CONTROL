<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Mill Moisture Controller</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #0a1428, #1e3c72); 
      color: white; 
      margin:0; 
      padding:15px; 
    }
    .container { max-width: 1300px; margin: auto; }
    .auth-box, .dashboard-box { 
      background: rgba(255,255,255,0.1); 
      backdrop-filter: blur(12px); 
      border-radius: 20px; 
      padding: 30px; 
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
    }
    .hidden { display: none !important; }
    .moisture-big { 
      font-size: 5.8rem; 
      font-weight: bold; 
      text-align: center; 
      color: #00ffcc; 
      text-shadow: 0 0 25px rgba(0,255,200,0.6); 
    }
    input, button { 
      width: 100%; 
      padding: 14px; 
      margin: 8px 0; 
      border: none; 
      border-radius: 8px; 
      font-size: 1.05rem; 
    }
    button { 
      font-weight: bold; 
      cursor: pointer; 
    }
    .btn-on { background: #28a745; color: white; }
    .btn-off { background: #dc3545; color: white; }
    .btn-auto { background: #ffc107; color: black; }

    .mill-view { 
      background: linear-gradient(#0f1f33, #1e3a5f); 
      border: 5px solid #334455; 
      border-radius: 20px; 
      padding: 20px; 
      height: 380px; 
      position: relative; 
      overflow: hidden; 
    }
    .conveyor { 
      position: absolute; 
      bottom: 75px; 
      width: 100%; 
      height: 58px; 
      background: repeating-linear-gradient(90deg, #444, #444 50px, #666 50px, #666 100px); 
      animation: conveyorMove 1.1s linear infinite; 
    }
    @keyframes conveyorMove { 
      0% { background-position: 0 0; } 
      100% { background-position: -120px 0; } 
    }
    .cotton { 
      position: absolute; 
      bottom: 88px; 
      width: 78px; 
      height: 45px; 
      background: linear-gradient(#f8f1e3, #e8d5b8); 
      border-radius: 50%; 
      animation: cottonFlow 7.5s linear infinite; 
    }
    @keyframes cottonFlow { 
      0% { left: -90px; } 
      100% { left: 105%; } 
    }
    .nozzle { 
      position: absolute; 
      top: 48px; 
      width: 30px; 
      height: 88px; 
      background: linear-gradient(#555, #333); 
      border-radius: 14px 14px 5px 5px; 
    }
    .mist { 
      position: absolute; 
      top: 98px; 
      left: -10px; 
      width: 48px; 
      height: 120px; 
      background: radial-gradient(circle, rgba(150,240,255,0.85) 30%, transparent); 
      border-radius: 50%; 
      opacity: 0; 
      animation: sprayMist 0.75s linear infinite; 
    }
    @keyframes sprayMist { 
      0% { transform: scale(0.6); opacity: 0.9; } 
      100% { transform: scale(1.45) translateY(35px); opacity: 0; } 
    }
    .pump { 
      position: absolute; 
      bottom: 28px; 
      left: 50px; 
      font-size: 3.2rem; 
      transition: all 0.3s; 
    }
    .pump.on { 
      animation: pumpPulse 0.55s infinite; 
      color: #00ffaa; 
    }
    @keyframes pumpPulse { 
      50% { transform: scale(1.15) rotate(10deg); } 
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Login Page -->
    <div id="authScreen">
      <div class="auth-box">
        <h1 style="text-align:center;">🧵 Cotton Mill Control</h1>
        <h3 style="text-align:center;">Login</h3>
       
        <input type="email" id="email" placeholder="Email Address" />
        <input type="password" id="password" placeholder="Password" />
        <input type="text" id="deviceIDInput" placeholder="Device ID" value="cotton_mill_01" />
        <button onclick="handleAuth()" style="background:#00cc88; color:white;">Login</button>
        <button onclick="signInWithGoogle()" style="background:#db4437; color:white;">Sign in with Google</button>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboardScreen" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>🧵 Cotton Mill Moisture Controller</h1>
        <button onclick="logout()" style="background:#dc3545; color:white; padding:10px 20px;">Logout</button>
      </div>

      <div class="moisture-big" id="moisture">0.0%</div>

      <!-- Animated Mill -->
      <div class="mill-view dashboard-box">
        <div class="nozzle" style="left:18%;"><div class="mist" id="mist1"></div></div>
        <div class="nozzle" style="left:33%;"><div class="mist" id="mist2"></div></div>
        <div class="nozzle" style="left:48%;"><div class="mist" id="mist3"></div></div>
        <div class="nozzle" style="left:64%;"><div class="mist" id="mist4"></div></div>
        <div class="conveyor"></div>
        <div class="cotton" style="animation-delay:0s"></div>
        <div class="cotton" style="animation-delay:2.5s"></div>
        <div class="pump" id="pumpIcon">⚙️</div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:15px; margin:20px 0;">
        <div class="dashboard-box"><b>Pump:</b> <span id="pump">OFF</span></div>
        <div class="dashboard-box"><b>Nozzles:</b> <span id="nozzles">0/4</span></div>
        <div class="dashboard-box"><b>Temp:</b> <span id="temp">0°C</span></div>
        <div class="dashboard-box"><b>Humidity:</b> <span id="humidity">0%</span></div>
      </div>

      <!-- Manual Control Section -->
      <div class="dashboard-box">
        <h2 style="text-align:center;">Control Mode</h2>
        <button id="modeBtn" onclick="toggleMode()" class="btn-auto">AUTO MODE</button>
       
        <h3 style="text-align:center; margin:15px 0;">Manual Control</h3>
        <button id="pumpBtn" onclick="togglePump()" class="btn-off">Pump: OFF</button>
        <button id="noz1Btn" onclick="toggleNozzle(1)" class="btn-off">Nozzle 1: OFF</button>
        <button id="noz2Btn" onclick="toggleNozzle(2)" class="btn-off">Nozzle 2: OFF</button>
        <button id="noz3Btn" onclick="toggleNozzle(3)" class="btn-off">Nozzle 3: OFF</button>
        <button id="noz4Btn" onclick="toggleNozzle(4)" class="btn-off">Nozzle 4: OFF</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAbNc3w78oCdn6K6BaExIPQ1C4TOT_u5MM",
      authDomain: "cotoon-mill-moisture-control.firebaseapp.com",
      projectId: "cotoon-mill-moisture-control",
      storageBucket: "cotoon-mill-moisture-control.firebasestorage.app",
      messagingSenderId: "963386638721",
      appId: "1:963386638721:web:7bf38960d8ff5987132880",
      measurementId: "G-WZEW8L9SMB"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    let currentRef = null;
    let isAutoMode = true;

    function handleAuth() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const devID = document.getElementById('deviceIDInput').value.trim();
      if (!devID) return alert("Enter Device ID");
      
      auth.signInWithEmailAndPassword(email, pass)
        .then(() => loadDashboard(devID))
        .catch(e => alert(e.message));
    }

    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => {
          const devID = document.getElementById('deviceIDInput').value.trim() || "cotton_mill_01";
          loadDashboard(devID);
        })
        .catch(e => alert(e.message));
    }

    function loadDashboard(devID) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      loadDevice(devID);
    }

    function loadDevice(devID) {
      if (currentRef) currentRef.off();
      
      currentRef = db.ref('devices/' + devID);

      currentRef.on('value', snap => {
        const d = snap.val() || {};
        
        // Update main display
        document.getElementById('moisture').textContent = (d.moisture || 0).toFixed(1) + '%';
        document.getElementById('pump').textContent = d.pump || 'OFF';
        document.getElementById('nozzles').textContent = (d.nozzles || 0) + '/4';
        document.getElementById('temp').textContent = (d.temp || 0).toFixed(1) + '°C';
        document.getElementById('humidity').textContent = (d.humidity || 0).toFixed(1) + '%';

        // Pump animation
        document.getElementById('pumpIcon').classList.toggle('on', d.pump === 'ON');

        // Mist animation
        for (let i = 1; i <= 4; i++) {
          const mist = document.getElementById('mist' + i);
          if (mist) mist.style.opacity = (i <= (d.nozzles || 0)) ? '1' : '0';
        }

        // Update manual control buttons
        updateControlButtons(d);
      });
    }

    function updateControlButtons(d) {
      // Pump button
      const pumpBtn = document.getElementById('pumpBtn');
      pumpBtn.textContent = `Pump: ${d.pump || 'OFF'}`;
      pumpBtn.className = (d.pump === 'ON') ? 'btn-on' : 'btn-off';

      // Nozzle buttons
      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`noz${i}Btn`);
        const isActive = (d.nozzles || 0) >= i;
        btn.textContent = `Nozzle ${i}: ${isActive ? 'ON' : 'OFF'}`;
        btn.className = isActive ? 'btn-on' : 'btn-off';
      }
    }

    function toggleMode() {
      isAutoMode = !isAutoMode;
      const btn = document.getElementById('modeBtn');
      btn.textContent = isAutoMode ? "AUTO MODE" : "MANUAL MODE";
      btn.style.background = isAutoMode ? "#ffc107" : "#17a2b8";
      currentRef.child('mode').set(isAutoMode ? "AUTO" : "MANUAL");
    }

    function togglePump() {
      if (!currentRef) return;
      currentRef.child('pump').once('value', snap => {
        const current = (snap.val() === 'ON') ? 'OFF' : 'ON';
        currentRef.child('pump').set(current);
      });
    }

    function toggleNozzle(n) {
      if (!currentRef) return;
      
      currentRef.child('nozzles').once('value', snap => {
        let currentNozzles = parseInt(snap.val()) || 0;
        
        if (currentNozzles >= n) {
          currentNozzles = n - 1;     // Turn off this and above
        } else {
          currentNozzles = n;         // Turn on up to this nozzle
        }
        
        currentRef.child('nozzles').set(currentNozzles);
      });
    }

    function logout() {
      auth.signOut().then(() => {
        document.getElementById('dashboardScreen').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
