<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Mill Moisture Controller</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #0a1428, #1e3c72); color: white; margin:0; padding:15px; }
    .container { max-width: 1300px; margin: auto; }
    .auth-box, .dashboard-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(12px); border-radius: 20px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .hidden { display: none !important; }
    .moisture-big { font-size: 5.8rem; font-weight: bold; text-align: center; color: #00ffcc; text-shadow: 0 0 25px rgba(0,255,200,0.6); }

    input, button { width: 100%; padding: 14px; margin: 10px 0; border: none; border-radius: 8px; font-size: 1.05rem; }
    button { font-weight: bold; cursor: pointer; }

    .mill-view { background: linear-gradient(#0f1f33, #1e3a5f); border: 5px solid #334455; border-radius: 20px; padding: 20px; height: 380px; position: relative; overflow: hidden; }
    .conveyor { position: absolute; bottom: 75px; width: 100%; height: 58px; background: repeating-linear-gradient(90deg, #444, #444 50px, #666 50px, #666 100px); animation: conveyorMove 1.1s linear infinite; }
    @keyframes conveyorMove { 0% { background-position: 0 0; } 100% { background-position: -120px 0; } }
    .cotton { position: absolute; bottom: 88px; width: 78px; height: 45px; background: linear-gradient(#f8f1e3, #e8d5b8); border-radius: 50%; animation: cottonFlow 7.5s linear infinite; }
    @keyframes cottonFlow { 0% { left: -90px; } 100% { left: 105%; } }
    .nozzle { position: absolute; top: 48px; width: 30px; height: 88px; background: linear-gradient(#555, #333); border-radius: 14px 14px 5px 5px; }
    .mist { position: absolute; top: 98px; left: -10px; width: 48px; height: 120px; background: radial-gradient(circle, rgba(150,240,255,0.85) 30%, transparent); border-radius: 50%; opacity: 0; animation: sprayMist 0.75s linear infinite; }
    @keyframes sprayMist { 0% { transform: scale(0.6); opacity: 0.9; } 100% { transform: scale(1.45) translateY(35px); opacity: 0; } }
    .pump { position: absolute; bottom: 28px; left: 50px; font-size: 3.2rem; transition: all 0.3s; }
    .pump.on { animation: pumpPulse 0.55s infinite; color: #00ffaa; }
    @keyframes pumpPulse { 50% { transform: scale(1.15) rotate(10deg); } }

    .chart-container { margin: 20px 0; background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; }
  </style>
</head>
<body>
  <div class="container">

    <!-- ================== LOGIN PAGE (First Page) ================== -->
    <div id="authScreen">
      <div class="auth-box">
        <h1 style="text-align:center;">🧵 Cotton Mill Control</h1>
        <h3 style="text-align:center; margin:20px 0;">Login</h3>
        
        <input type="email" id="email" placeholder="Email Address" />
        <input type="password" id="password" placeholder="Password" />
        <input type="text" id="deviceIDInput" placeholder="Device ID (e.g. cotton_mill_01)" value="cotton_mill_01" />

        <button onclick="handleAuth()" style="background:#00cc88; color:white;">Login</button>
        <button onclick="signInWithGoogle()" style="background:#db4437; color:white;">Sign in with Google</button>
      </div>
    </div>

    <!-- ================== DASHBOARD ================== -->
    <div id="dashboardScreen" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>🧵 Cotton Mill Moisture Controller</h1>
        <button onclick="logout()" style="background:#dc3545; color:white; padding:10px 20px;">Logout</button>
      </div>

      <div class="moisture-big" id="moisture">0.0%</div>

      <!-- Animated Cotton Mill -->
      <div class="mill-view dashboard-box">
        <div class="nozzle" style="left:18%;"><div class="mist" id="mist1"></div></div>
        <div class="nozzle" style="left:33%;"><div class="mist" id="mist2"></div></div>
        <div class="nozzle" style="left:48%;"><div class="mist" id="mist3"></div></div>
        <div class="nozzle" style="left:64%;"><div class="mist" id="mist4"></div></div>
        <div class="conveyor"></div>
        <div class="cotton" style="animation-delay:0s"></div>
        <div class="cotton" style="animation-delay:2.5s"></div>
        <div class="pump" id="pumpIcon">⚙️</div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:15px; margin:20px 0;">
        <div class="dashboard-box"><b>Pump:</b> <span id="pump">OFF</span></div>
        <div class="dashboard-box"><b>Nozzles:</b> <span id="nozzles">0/4</span></div>
        <div class="dashboard-box"><b>Temp:</b> <span id="temp">0°C</span></div>
        <div class="dashboard-box"><b>Humidity:</b> <span id="humidity">0%</span></div>
      </div>

      <!-- Charts -->
      <div class="dashboard-box">
        <h2 style="text-align:center;">Real-Time Data</h2>
        <div class="chart-container"><canvas id="moistureChart" height="85"></canvas></div>
        <div class="chart-container"><canvas id="tempChart" height="85"></canvas></div>
        <div class="chart-container"><canvas id="humidityChart" height="85"></canvas></div>
      </div>
    </div>
  </div>

  <script>
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAbNc3w78oCdn6K6BaExIPQ1C4TOT_u5MM",
  authDomain: "cotoon-mill-moisture-control.firebaseapp.com",
  projectId: "cotoon-mill-moisture-control",
  storageBucket: "cotoon-mill-moisture-control.firebasestorage.app",
  messagingSenderId: "963386638721",
  appId: "1:963386638721:web:7bf38960d8ff5987132880",
  measurementId: "G-WZEW8L9SMB"
};

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentRef = null;
    let moistureChart, tempChart, humidityChart;
    let moistureData = [], tempData = [], humidityData = [], labels = [];

    function initCharts() {
      const opt = { responsive: true, maintainAspectRatio: false };
      moistureChart = new Chart(document.getElementById('moistureChart'), { type: 'line', data: { labels, datasets: [{ label: 'Moisture (%)', data: moistureData, borderColor: '#00ffcc', tension: 0.4 }] }, options: opt });
      tempChart = new Chart(document.getElementById('tempChart'), { type: 'line', data: { labels, datasets: [{ label: 'Temperature (°C)', data: tempData, borderColor: '#ff8800', tension: 0.4 }] }, options: opt });
      humidityChart = new Chart(document.getElementById('humidityChart'), { type: 'line', data: { labels, datasets: [{ label: 'Humidity (%)', data: humidityData, borderColor: '#4488ff', tension: 0.4 }] }, options: opt });
    }

    function updateCharts(m, t, h) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      labels.push(time);
      moistureData.push(m); tempData.push(t); humidityData.push(h);
      if (labels.length > 25) {
        labels.shift(); moistureData.shift(); tempData.shift(); humidityData.shift();
      }
      moistureChart.update(); tempChart.update(); humidityChart.update();
    }

    function loadDevice(devID) {
      if (currentRef) currentRef.off();
      currentRef = db.ref('devices/' + devID);
      currentRef.on('value', snap => {
        const d = snap.val() || {};
        document.getElementById('moisture').textContent = (d.moisture || 0).toFixed(1) + '%';
        document.getElementById('pump').textContent = d.pump || 'OFF';
        document.getElementById('nozzles').textContent = (d.nozzles || 0) + '/4';
        document.getElementById('temp').textContent = (d.temp || 0).toFixed(1) + '°C';
        document.getElementById('humidity').textContent = (d.humidity || 0).toFixed(1) + '%';

        document.getElementById('pumpIcon').classList.toggle('on', d.pump === 'ON');

        for (let i = 1; i <= 4; i++) {
          const mist = document.getElementById('mist' + i);
          if (mist) mist.style.opacity = (i <= (d.nozzles || 0)) ? '1' : '0';
        }
        updateCharts(d.moisture || 0, d.temp || 0, d.humidity || 0);
      });
    }

    function handleAuth() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      const devID = document.getElementById('deviceIDInput').value.trim();

      if (!email || !pass || !devID) return alert("All fields are required!");

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => {
          localStorage.setItem('lastDeviceID', devID);
          document.getElementById('authScreen').classList.add('hidden');
          document.getElementById('dashboardScreen').classList.remove('hidden');
          initCharts();
          loadDevice(devID);
        })
        .catch(e => alert("Login Failed: " + e.message));
    }

    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => {
          const devID = document.getElementById('deviceIDInput').value.trim() || "cotton_mill_01";
          document.getElementById('authScreen').classList.add('hidden');
          document.getElementById('dashboardScreen').classList.remove('hidden');
          initCharts();
          loadDevice(devID);
        })
        .catch(e => alert(e.message));
    }

    function logout() { auth.signOut(); }

    auth.onAuthStateChanged(user => {
      if (user) {
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        initCharts();
        const saved = localStorage.getItem('lastDeviceID') || "cotton_mill_01";
        document.getElementById('deviceIDInput').value = saved;
        loadDevice(saved);
      }
    });
  </script>
</body>
</html>
