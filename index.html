<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotton Mill Moisture Controller</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    body { 
      font-family: 'Segoe UI', Arial, sans-serif; 
      background: linear-gradient(135deg, #0a1428, #1e3c72); 
      color: white; 
      margin:0; 
      padding:15px; 
    }
    .container { max-width: 1300px; margin: auto; }

    /* ================== ATTRACTIVE LOGIN PAGE ================== */
    .auth-box {
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 40px 30px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.6);
      max-width: 420px;
      margin: 80px auto;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .auth-box h1 {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00ffcc, #00ccff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .auth-box input {
      width: 100%;
      padding: 16px;
      margin: 12px 0;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 1.05rem;
    }
    .auth-box input::placeholder { color: #aaa; }
    button { 
      width: 100%; 
      padding: 16px; 
      margin: 12px 0; 
      border: none; 
      border-radius: 12px; 
      font-size: 1.1rem; 
      font-weight: bold; 
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary { background: #00cc88; color: white; }
    .btn-primary:hover { background: #00e699; transform: translateY(-2px); }
    .btn-google { background: #db4437; color: white; }
    .btn-google:hover { background: #e05a4e; }

    /* Dashboard Styles */
    .hidden { display: none !important; }
    .moisture-big { font-size: 5.8rem; font-weight: bold; text-align: center; color: #00ffcc; text-shadow: 0 0 25px rgba(0,255,200,0.6); }

    .btn-on { background: #28a745; color: white; }
    .btn-off { background: #dc3545; color: white; }
    .btn-auto { background: #ffc107; color: black; padding: 18px; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div class="container">

    <!-- ================== ATTRACTIVE LOGIN PAGE ================== -->
    <div id="authScreen">
      <div class="auth-box">
        <h1>🧵 Cotton Mill</h1>
        <h3 style="text-align:center; margin-bottom:25px;">Moisture Control System</h3>
        
        <input type="email" id="email" placeholder="Email Address" />
        <input type="password" id="password" placeholder="Password" />
        <input type="text" id="deviceIDInput" placeholder="Device ID (e.g. cotton_mill_01)" value="cotton_mill_01" />
        
        <button onclick="handleAuth()" class="btn-primary">Login</button>
        <button onclick="signInWithGoogle()" class="btn-google">Sign in with Google</button>
      </div>
    </div>

    <!-- ================== DASHBOARD ================== -->
    <div id="dashboardScreen" class="hidden">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>🧵 Cotton Mill Moisture Controller</h1>
        <button onclick="logout()" style="background:#dc3545; color:white; padding:10px 20px;">Logout</button>
      </div>

      <div class="moisture-big" id="moisture">0.0%</div>

      <div class="dashboard-box" style="height:340px; position:relative; overflow:hidden; margin:20px 0;">
        <div class="nozzle" style="left:18%;"><div class="mist" id="mist1"></div></div>
        <div class="nozzle" style="left:33%;"><div class="mist" id="mist2"></div></div>
        <div class="nozzle" style="left:48%;"><div class="mist" id="mist3"></div></div>
        <div class="nozzle" style="left:64%;"><div class="mist" id="mist4"></div></div>
        <div class="conveyor"></div>
        <div class="cotton" style="animation-delay:0s"></div>
        <div class="cotton" style="animation-delay:2.5s"></div>
        <div class="pump" id="pumpIcon">⚙️</div>
      </div>

      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:15px; margin:20px 0;">
        <div class="dashboard-box"><b>Pump:</b> <span id="pump">OFF</span></div>
        <div class="dashboard-box"><b>Nozzles:</b> <span id="nozzles">0/4</span></div>
      </div>

      <!-- Manual Control -->
      <div class="dashboard-box">
        <h2 style="text-align:center;">Control Mode</h2>
        <button id="modeBtn" onclick="toggleMode()" class="btn-auto">AUTO MODE</button>

        <h3 style="text-align:center; margin:20px 0 10px 0;">Manual Control</h3>
        <button id="pumpBtn" onclick="togglePump()" class="btn-off">Pump : OFF</button>
        <button id="noz1Btn" onclick="toggleNozzle(1)" class="btn-off">Nozzle 1 : OFF</button>
        <button id="noz2Btn" onclick="toggleNozzle(2)" class="btn-off">Nozzle 2 : OFF</button>
        <button id="noz3Btn" onclick="toggleNozzle(3)" class="btn-off">Nozzle 3 : OFF</button>
        <button id="noz4Btn" onclick="toggleNozzle(4)" class="btn-off">Nozzle 4 : OFF</button>
      </div>
    </div>
  </div>

  <script>
    // ================== YOUR FIREBASE CONFIG ==================
    const firebaseConfig = {
      apiKey: "AIzaSyAbNc3w78oCdn6K6BaExIPQ1C4TOT_u5MM",
      authDomain: "cotoon-mill-moisture-control.firebaseapp.com",
      projectId: "cotoon-mill-moisture-control",
      storageBucket: "cotoon-mill-moisture-control.firebasestorage.app",
      messagingSenderId: "963386638721",
      appId: "1:963386638721:web:7bf38960d8ff5987132880",
      measurementId: "G-WZEW8L9SMB"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    let currentRef = null;
    let isAutoMode = true;

    function handleAuth() {
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value.trim();
      const devID = document.getElementById('deviceIDInput').value.trim();

      if (!email || !pass || !devID) {
        alert("Please fill all fields");
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then(() => loadDashboard(devID))
        .catch(e => alert("Login Error: " + e.message));
    }

    function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider)
        .then(() => {
          const devID = document.getElementById('deviceIDInput').value.trim() || "cotton_mill_01";
          loadDashboard(devID);
        })
        .catch(e => alert("Google Login Error: " + e.message));
    }

    function loadDashboard(devID) {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('dashboardScreen').classList.remove('hidden');
      loadDevice(devID);
    }

    function loadDevice(devID) {
      if (currentRef) currentRef.off();
      currentRef = db.ref('devices/' + devID);

      currentRef.on('value', (snap) => {
        const d = snap.val() || {};
        document.getElementById('moisture').textContent = (d.moisture || 0).toFixed(1) + '%';
        document.getElementById('pump').textContent = d.pump || 'OFF';
        document.getElementById('nozzles').textContent = (d.nozzles || 0) + '/4';

        document.getElementById('pumpIcon').classList.toggle('on', d.pump === 'ON');

        for (let i = 1; i <= 4; i++) {
          const mist = document.getElementById('mist' + i);
          if (mist) mist.style.opacity = (i <= (d.nozzles || 0)) ? '1' : '0';
        }

        updateButtons(d);
      });
    }

    function updateButtons(d) {
      const pumpBtn = document.getElementById('pumpBtn');
      pumpBtn.textContent = `Pump : ${d.pump || 'OFF'}`;
      pumpBtn.className = (d.pump === 'ON') ? 'btn-on' : 'btn-off';

      for (let i = 1; i <= 4; i++) {
        const active = d[`nozzle${i}`] === true;
        const btn = document.getElementById(`noz${i}Btn`);
        if (btn) {
          btn.textContent = `Nozzle ${i} : ${active ? 'ON' : 'OFF'}`;
          btn.className = active ? 'btn-on' : 'btn-off';
        }
      }
    }

    function toggleMode() {
      isAutoMode = !isAutoMode;
      const btn = document.getElementById('modeBtn');
      btn.textContent = isAutoMode ? "AUTO MODE" : "MANUAL MODE";
      if (currentRef) currentRef.child('mode').set(isAutoMode ? "AUTO" : "MANUAL");
    }

    function togglePump() {
      if (currentRef) currentRef.child('manualPump').set(true);
    }

    function toggleNozzle(n) {
      if (currentRef) currentRef.child('manualNozzle' + n).set(true);
    }

    function logout() { auth.signOut(); }
  </script>
</body>
</html>
